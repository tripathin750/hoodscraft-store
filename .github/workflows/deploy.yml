name: Deploy to Netlify
on:
  push:
    branches: [main, master]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: true }
jobs:
  netlify:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      # Canonical URL used for sitemap, canonical tags and social previews. Change when you get a custom domain.
      SITE_URL: https://hoodscraft.netlify.app
    defaults: { run: { working-directory: standalone } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx --yes netlify-cli@latest deploy --prod --dir=dist --no-build
